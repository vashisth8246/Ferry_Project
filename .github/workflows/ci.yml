name: CI - Test and Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt flake8
      - run: flake8 . --exclude=.git,.venv,venv --select=E9,F63,F7,F82 --show-source
      - run: node --check frontend/app.js
      - run: pip install coverage
      - run: pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
      - name: Generate coverage summary
        if: github.event_name == 'pull_request'
        run: |
          pip install coverage
          COVERAGE=$(coverage report --format=total | grep TOTAL | awk '{print $4}' | sed 's/%//')
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          echo "Test Coverage: ${COVERAGE}%"
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const coverage = process.env.COVERAGE;
            const comment = `### 📊 Test Coverage Report\n\n**Overall Coverage:** ${coverage}%\n\n---\n*This comment was automatically generated by CI workflow.`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Test Coverage Report')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ferry:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both services and their connection
        run: |
          docker run -d --name ferry-test -p 5000:5000 -p 8501:8501 ferry:test
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --max-time 10 http://localhost:5000/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --max-time 10 http://localhost:8501/_stcore/health
          docker exec ferry-test python -c "from api_client import fetch_json; assert fetch_json('/api/data/summary')['total_records'] > 0; assert fetch_json('/api/models/results'); assert fetch_json('/api/eda/summary'); assert fetch_json('/api/uncertainty/predictions', n=5)"
      - name: Verify product workspace
        run: |
          curl --fail http://localhost:5000/app
          curl --fail http://localhost:5000/api/product/overview
          curl --fail --header "Content-Type: application/json" --data '{"date":"2026-07-18","seats":250,"departures":3}' http://localhost:5000/api/product/scenario
      - name: Render dashboard pages with live API data
        run: docker exec ferry-test python scripts/verify_dashboard.py
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs ferry-test || true
          docker rm -f ferry-test || true
  deployment-status:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Check Render deployment health
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "RENDER_APP_URL not set; skipping deployment status check"
            exit 0
          fi
          echo "Checking Render deployment at $RENDER_APP_URL"
          curl --fail --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
            "$RENDER_APP_URL/health" || exit 1
          echo "✅ Render deployment is healthy"
